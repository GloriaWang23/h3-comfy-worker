name: sync models

# Makes the Hugging Face repo the endpoint caches (GloriaWang23/h3-comfy-runtime) hold exactly
# the files in WANT: copies missing ones from Hugging Face / Civitai and deletes the rest.
# Endpoints pin a commit, so nothing changes for them until their model reference
# and H3_MODEL_SHA are moved to the commit this prints.
# Needs the repository secrets HF_TOKEN (write access to the target repo) and CIVITAI_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET: GloriaWang23/h3-comfy-runtime
    steps:
      # Files are downloaded and committed one at a time (largest ~23 GB) on /mnt.
      - name: Disk
        run: |
          sudo mkdir -p /mnt/models && sudo chown "$USER" /mnt/models
          df -h / /mnt

      - run: pip install -q -U "huggingface_hub[hf_xet]"

      - name: Download, then commit add + deletes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_TOKEN }}
        shell: python
        run: |
          import json, os, shutil, urllib.error, urllib.request
          from huggingface_hub import CommitOperationDelete, HfApi, hf_hub_download

          # The complete file set of the repo. Anything else is deleted (README/.gitattributes kept);
          # pinned older commits keep their files.
          #   path in target -> ("hf", source repo, file) | ("civitai", version id, file name) | None (already there)
          WANT = {
              # Comfy-Org official bases, text encoder, VAEs
              "diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors": None,
              "diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors": None,
              "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors": None,
              "vae/minimax_h3_video_vae_int8_convrot.safetensors": None,
              "vae/minimax_h3_audio_vae_fp32.safetensors": None,
              # 10Eros-Max beta7 int8HQ (TenStrip) and PRISM-beta7 (Singularity-V2 x 10Eros)
              "diffusion_models/10Eros_Max_h3_8stepTURBO_beta7_int8HQ.safetensors":
                  ("hf", "TenStrip/10Eros-Max", "10Eros_Max_h3_8stepTURBO_beta7_int8HQ.safetensors"),
              "diffusion_models/10Eros_Max_h3_8stepTURBO_beta7_SingularityV2_int8HQ.safetensors":
                  ("hf", "OliviaRossi/Minimax-h3_Singularity-x-10Eros-Max_PRISM",
                   "10Eros_Max_h3_8stepTURBO_beta7_SingularityV2_int8HQ.safetensors"),
              # FastH3: V2 for t2v/i2v, Omni for ref2v (both used by Comfy-Org templates)
              "diffusion_models/fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors": None,
              "diffusion_models/fasth3_omniref_8step_pruned_int8_convrot.safetensors":
                  ("hf", "FastVideo/FastH3-Omni-Comfy", "diffusion_models/fasth3_omniref_8step_pruned_int8_convrot.safetensors"),
              # lightx2v Turbo LoRAs: FL2V 8-step v1.1 768p (shift 6/3), Ref2V 8-step v1.0 768p
              "loras/minimax_h3_fl2v_turbo_8step_v1.1_768p_comfyui_bf16.safetensors":
                  ("hf", "lightx2v/Minimax-h3-Turbo", "minimax_h3_fl2v_turbo_8step_v1.1_768p_comfyui_bf16.safetensors"),
              "loras/minimax_h3_ref2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors":
                  ("hf", "lightx2v/Minimax-h3-Turbo", "minimax_h3_ref2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors"),
              # NSFW LoRAs from Civitai (model version id, file name): MysticXXX V5, NSFW Unlocked V2.1
              "loras/MysticXXX_MMH3-V5.safetensors": ("civitai", 3416478, "MysticXXX_MMH3-V5.safetensors"),
              "loras/MysticXXX_MMH3-V5-ref2va.safetensors": ("civitai", 3416478, "MysticXXX_MMH3-V5-ref2va.safetensors"),
              "loras/Minimax_H3_Unlocked_V2.1.safetensors": ("civitai", 3413468, "Minimax_H3_Unlocked_V2.1.safetensors"),
              "loras/HMNSFW-AIO-V2.5.safetensors": None,
          }
          KEEP = {"README.md", ".gitattributes"}

          def civitai(version_id, name, dest):
              # The version's file list gives each file's download URL. Civitai redirects it to
              # signed storage that rejects the Authorization header, so take the redirect
              # target and fetch it without the header.
              ua = {"User-Agent": "h3-sync-models/1.0"}  # Cloudflare rejects urllib's default agent
              auth = {**ua, "Authorization": f"Bearer {os.environ['CIVITAI_TOKEN']}"}
              meta = json.load(urllib.request.urlopen(urllib.request.Request(
                  f"https://civitai.com/api/v1/model-versions/{version_id}", headers=auth)))
              url = next(f["downloadUrl"] for f in meta["files"] if f["name"] == name)
              class Stop(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      raise urllib.error.HTTPError(newurl, code, msg, headers, fp)
              try:
                  urllib.request.build_opener(Stop).open(urllib.request.Request(url, headers=auth))
                  raise SystemExit(f"civitai: no redirect for {name}")
              except urllib.error.HTTPError as e:
                  if e.code not in (301, 302, 303, 307, 308):
                      raise
                  signed = e.url
              with urllib.request.urlopen(urllib.request.Request(signed, headers=ua)) as r, open(dest, "wb") as out:
                  shutil.copyfileobj(r, out, 16 << 20)

          api = HfApi()
          target = os.environ["TARGET"]
          present = set(api.list_repo_files(target))
          missing = [p for p, src in WANT.items() if src is None and p not in present]
          if missing:
              raise SystemExit(f"expected to already be in {target}: {missing}")
          # One commit per added file, removed locally right after: the runner's disk cannot
          # hold all new weights at once. The last commit printed is the one to pin.
          last = None
          for dest, src in WANT.items():
              if src is None or dest in present:
                  continue
              local = os.path.join("/mnt/models", os.path.basename(dest))
              if src[0] == "hf":
                  path = hf_hub_download(src[1], src[2], local_dir="/mnt/models/_hf")
                  shutil.move(path, local)
              else:
                  civitai(src[1], src[2], local)
              print(f"downloaded {dest}: {os.path.getsize(local) / 1e9:.2f} GB", flush=True)
              last = api.upload_file(path_or_fileobj=local, path_in_repo=dest, repo_id=target,
                                     commit_message=f"Sync models: +{os.path.basename(dest)}").oid
              print(f"committed {dest} -> {last}", flush=True)
              os.remove(local)
              shutil.rmtree("/mnt/models/_hf", ignore_errors=True)
          deletes = sorted(present - set(WANT) - KEEP)
          if deletes:
              last = api.create_commit(target, operations=[CommitOperationDelete(path_in_repo=p) for p in deletes],
                                       commit_message="Sync models: " + ", ".join("-" + p.split("/")[-1] for p in deletes)).oid
          print(f"NEW COMMIT {last}" if last else "nothing to do")
          print("files now:")
          total = 0
          for f in api.list_repo_tree(target, recursive=True):
              if getattr(f, "size", None):
                  total += f.size
                  print(f"  {f.path}  {f.size / 1e9:.2f} GB")
          print(f"total {total / 1e9:.1f} GB")
