name: sync models

# Makes the Hugging Face repo the endpoint caches (GloriaWang23/h3-comfy-runtime) hold exactly
# the files in WANT: copies missing ones from Hugging Face / Civitai and deletes the rest.
# Endpoints pin a commit, so nothing changes for them until their model reference
# and H3_MODEL_SHA are moved to the commit this prints.
# Needs the repository secrets HF_TOKEN (write access to the target repo) and CIVITAI_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET: GloriaWang23/h3-comfy-runtime
    steps:
      # Files are downloaded and committed one at a time (largest ~40 GB) on /mnt.
      - name: Disk
        run: |
          sudo mkdir -p /mnt/models && sudo chown "$USER" /mnt/models
          df -h / /mnt

      - run: pip install -q -U "huggingface_hub[hf_xet]"

      - name: Download, then commit add + deletes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_TOKEN }}
        shell: python
        run: |
          import hashlib, json, os, shutil, urllib.error, urllib.request
          from huggingface_hub import CommitOperationDelete, HfApi, hf_hub_download

          # The complete file set of the repo. Anything else is deleted (README/.gitattributes kept);
          # pinned older commits keep their files.
          #   path in target -> ("hf", source repo, file[, revision]) | ("civitai", version id, file name) | None (already there)
          WANT = {
              # Comfy-Org official bases, text encoder, VAEs
              "diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors": None,
              "diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors": None,
              "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors": None,
              "vae/minimax_h3_video_vae_int8_convrot.safetensors": None,
              "vae/minimax_h3_audio_vae_fp32.safetensors": None,
              # 10Eros-Max v1.0 int8 HQ (TenStrip)
              "diffusion_models/10Eros_Max_8stepTurbo_v1.0_hybrid-int8_HQ.safetensors":
                  ("hf", "TenStrip/10Eros-Max", "10Eros_Max_8stepTurbo_v1.0_hybrid-int8_HQ.safetensors",
                   "875036a9e9c363483095c82ee5da18fee3cef08b"),
              # Sulphur 3 (SulphurAI): the release file, plus their 4-bit file as a fallback for 32 GB cards
              "diffusion_models/s3.safetensors":
                  ("hf", "SulphurAI/Sulphur-3", "s3.safetensors", "988224b9913740d60ee54b5a53c7a892467edc76"),
              "diffusion_models/s3_w4a8.safetensors":
                  ("hf", "SulphurAI/Sulphur-3", "quantized/s3_w4a8.safetensors", "988224b9913740d60ee54b5a53c7a892467edc76"),
              # Turbo LoRAs: FL2V 8-step v1.1 768p (shift 6/3) and v1.2 768p (12/3). lightx2v's v1.2 patches
              # the unpruned AdaLN; Kijai's conversion projects it onto the pruned fl2va curve basis.
              # Ref2V 8-step v1.0 768p (12/3).
              "loras/minimax_h3_fl2v_turbo_8step_v1.1_768p_comfyui_bf16.safetensors": None,
              "loras/minimax_h3_fl2v_turbo_8step_v1.2_768p_pruned_avg_rank_24_bf16.safetensors":
                  ("hf", "Kijai/MiniMax-H3_comfy", "loras/minimax_h3_fl2v_turbo_8step_v1.2_768p_pruned_avg_rank_24_bf16.safetensors",
                   "fbf3495813247e00cd86570d4238da68dbd8f93e"),
              "loras/minimax_h3_ref2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors": None,
              # Pika H3 Flex 6-step LoRAs, Comfy-Org repack (the files the official templates load)
              "loras/pika_h3_flex_fl2va_v1_bf16.safetensors": None,
              "loras/pika_h3_flex_ref2va_v1_bf16.safetensors": None,
              # NSFW LoRAs: MysticXXX V5; HMNSFW V3 (HF mirror, same SHA256 as Civitai version 3446189)
              "loras/MysticXXX_MMH3-V5.safetensors": None,
              "loras/MysticXXX_MMH3-V5-ref2va.safetensors": None,
              "loras/HMNSFW-Extreme-Realism.safetensors":
                  ("hf", "fnjerry/HMNSFW-Extreme-Realism", "HMNSFW-Extreme-Realism.safetensors",
                   "294bc90a521c1f6342dd102ab6abd7894551bf44"),
              # Swap / head-swap LoRAs for the studio's Ref2V edit mode, with their authors' turbo LoRAs
              # (the same files and commits as the character-swap runtime repo).
              "loras/h3_character_swap_v1.5.safetensors":
                  ("hf", "akatz-ai/MiniMax-H3-Character-Swap-LoRA", "h3_character_swap_v1.5.safetensors",
                   "96ea3407b230b6f7df71c58c70e31df96bd7e533"),
              "loras/minimax_h3_character_swap_v1.1_ref2va_fro.safetensors":
                  ("hf", "Alissonerdx/Minimax-H3-ComfyUI", "loras/minimax_h3_character_swap_v1.1_ref2va_fro.safetensors",
                   "64244a4fdf226c8d37b8470d1893b6ba9ab54de1"),
              "loras/minimax_h3_head_swap_v1.0_r32.safetensors":
                  ("hf", "Alissonerdx/Minimax-H3-ComfyUI", "loras/minimax_h3_head_swap_v1.0_r32.safetensors",
                   "64244a4fdf226c8d37b8470d1893b6ba9ab54de1"),
              "loras/minimax_h3_dmd_ref2va_8step_turbo_pruned.safetensors":
                  ("hf", "drbaph/MiniMax-H3-Turbo-Lora-ComfyUI", "experimental/minimax_h3_dmd_ref2va_8step_turbo_pruned.safetensors",
                   "bb2bc497cbaca89dadd0bcf1856eed4f8275be20"),
              "loras/minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors":
                  ("hf", "lightx2v/Minimax-h3-Turbo", "minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors",
                   "30f485ed874aa44c8183348ad361c5eabad318da"),
              # NSFW Unlocked V3 (Civitai only). Last: needs a valid CIVITAI_TOKEN.
              "loras/Minimax_H3_Unlocked_V3.safetensors": ("civitai", 3446226, "Minimax_H3_Unlocked_V3.safetensors"),
          }
          # Files whose publisher's SHA256 is checked before they are committed.
          SHA256 = {
              "loras/HMNSFW-Extreme-Realism.safetensors": "55aa39239ea4b408dee601cb0fa49157ec13fe2a54eccbb2fb725b124e43c1b5",
              "loras/Minimax_H3_Unlocked_V3.safetensors": "a423ceb3363ab5bf305d99236e6acc7fddab265896e7b4a3d85778396ebc4963",
              "loras/h3_character_swap_v1.5.safetensors": "8f2c3c3eba161df8d0c6099598b4730f641f5ce01e04cd16d2427cff8a35218f",
              "loras/minimax_h3_character_swap_v1.1_ref2va_fro.safetensors": "ab21167bed71db99ac09527ad1f26f5f3517687ebf2e1f1bd5e91cc0bdf9b9c3",
              "loras/minimax_h3_head_swap_v1.0_r32.safetensors": "ea97bd1a8178460661055784d63b4cb560732196fd15d5d7f33bfd214b65ab00",
              "loras/minimax_h3_dmd_ref2va_8step_turbo_pruned.safetensors": "693f41129785f31a820d32100b698cdcc42182c27c291f37f47d1ca5f38f5c20",
              "loras/minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors": "08cfe946033af7d27719b964b6e0a0e50c32138daabbd6ce4137e23df6bf9980",
          }
          KEEP = {"README.md", ".gitattributes"}

          def civitai(version_id, name, dest):
              # The version's file list gives each file's download URL. Civitai redirects it to
              # signed storage that rejects the Authorization header, so take the redirect
              # target and fetch it without the header.
              ua = {"User-Agent": "h3-sync-models/1.0"}  # Cloudflare rejects urllib's default agent
              auth = {**ua, "Authorization": f"Bearer {os.environ['CIVITAI_TOKEN']}"}
              meta = json.load(urllib.request.urlopen(urllib.request.Request(
                  f"https://civitai.com/api/v1/model-versions/{version_id}", headers=auth)))
              url = next(f["downloadUrl"] for f in meta["files"] if f["name"] == name)
              class Stop(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      raise urllib.error.HTTPError(newurl, code, msg, headers, fp)
              try:
                  urllib.request.build_opener(Stop).open(urllib.request.Request(url, headers=auth))
                  raise SystemExit(f"civitai: no redirect for {name}")
              except urllib.error.HTTPError as e:
                  if e.code not in (301, 302, 303, 307, 308):
                      raise
                  signed = e.url
              with urllib.request.urlopen(urllib.request.Request(signed, headers=ua)) as r, open(dest, "wb") as out:
                  shutil.copyfileobj(r, out, 16 << 20)

          api = HfApi()
          target = os.environ["TARGET"]
          present = set(api.list_repo_files(target))
          missing = [p for p, src in WANT.items() if src is None and p not in present]
          if missing:
              raise SystemExit(f"expected to already be in {target}: {missing}")
          # One commit per added file, removed locally right after: the runner's disk cannot
          # hold all new weights at once. The last commit printed is the one to pin.
          last = None
          for dest, src in WANT.items():
              if src is None or dest in present:
                  continue
              local = os.path.join("/mnt/models", os.path.basename(dest))
              if src[0] == "hf":
                  path = hf_hub_download(src[1], src[2], revision=src[3] if len(src) > 3 else None, local_dir="/mnt/models/_hf")
                  shutil.move(path, local)
              else:
                  civitai(src[1], src[2], local)
              if dest in SHA256:
                  with open(local, "rb") as f:
                      got = hashlib.file_digest(f, "sha256").hexdigest()
                  if got != SHA256[dest]:
                      raise SystemExit(f"{dest}: sha256 {got} != {SHA256[dest]}")
              print(f"downloaded {dest}: {os.path.getsize(local) / 1e9:.2f} GB", flush=True)
              last = api.upload_file(path_or_fileobj=local, path_in_repo=dest, repo_id=target,
                                     commit_message=f"Sync models: +{os.path.basename(dest)}").oid
              print(f"committed {dest} -> {last}", flush=True)
              os.remove(local)
              shutil.rmtree("/mnt/models/_hf", ignore_errors=True)
          deletes = sorted(present - set(WANT) - KEEP)
          if deletes:
              last = api.create_commit(target, operations=[CommitOperationDelete(path_in_repo=p) for p in deletes],
                                       commit_message="Sync models: " + ", ".join("-" + p.split("/")[-1] for p in deletes)).oid
          print(f"NEW COMMIT {last}" if last else "nothing to do")
          print("files now:")
          total = 0
          for f in api.list_repo_tree(target, recursive=True):
              if getattr(f, "size", None):
                  total += f.size
                  print(f"  {f.path}  {f.size / 1e9:.2f} GB")
          print(f"total {total / 1e9:.1f} GB")
