name: sync live models

# Builds GloriaWang23/h3-live-runtime: the Hugging Face repo the h3-live serverless endpoint
# caches (one cached model per endpoint, and the whole repo is downloaded, so it holds only
# the files the livestream loads). Final stack (round 11, 2026-10-14): 10Eros TURBO-hybrid beta5
# (real-time tier) + 10Eros beta6 (high-quality tier), optional HMNSFW / MysticXXX V4 LoRAs.
# Files in the repo that are not in FILES are deleted, so the cached snapshot stays minimal. Files are copied from their public source repos one at
# a time (download, upload, delete) so the runner's disk only ever holds one file.
# Independent of the studio endpoint and of h3-comfy-runtime. Needs the secret HF_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET: GloriaWang23/h3-live-runtime
    steps:
      - name: Disk
        run: |
          sudo mkdir -p /mnt/models && sudo chown "$USER" /mnt/models
          df -h / /mnt

      - run: pip install -q -U "huggingface_hub[hf_xet]"

      - name: Copy files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_XET_HIGH_PERFORMANCE: "1"
        shell: python
        run: |
          import os, shutil, time
          from huggingface_hub import HfApi, hf_hub_download

          FILES = [
              # (source repo, file in source, path in target) — same layout as the pod's models/comfy
              ("Comfy-Org/MiniMax-H3", "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors", "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"),
              ("Comfy-Org/MiniMax-H3", "vae/minimax_h3_video_vae_int8_convrot.safetensors", "vae/minimax_h3_video_vae_int8_convrot.safetensors"),
              ("Kijai/MiniMax-H3-experimental", "minimax_h3_lynnreal_light_vae_int8_convrot.safetensors", "vae/minimax_h3_lynnreal_light_vae_int8_convrot.safetensors"),
              ("Comfy-Org/MiniMax-H3", "vae/minimax_h3_audio_vae_fp32.safetensors", "vae/minimax_h3_audio_vae_fp32.safetensors"),
              ("LBH-123-AI/Minimax_h3_latent_Upscaler", "minimax_h3_latent_upscaler_3d_conv_v1/minimax_h3_latent_upscaler_3d_conv_v1_fp16.safetensors", "latent_upscale_models/minimax_h3_latent_upscaler_3d_conv_v1_fp16.safetensors"),
              ("GloriaWang23/h3-comfy-runtime", "loras/HMNSFW-AIO-V2.5.safetensors", "loras/HMNSFW-AIO-V2.5.safetensors"),
              ("GloriaWang23/h3-comfy-runtime", "loras/MysticXXX_MMH3-V4.safetensors", "loras/MysticXXX_MMH3-V4.safetensors"),
              ("GloriaWang23/h3-comfy-runtime", "loras/MysticXXX_MMH3-V4-ref2va.safetensors", "loras/MysticXXX_MMH3-V4-ref2va.safetensors"),
              ("TenStrip/10Eros-Max", "10Eros_Max_h3_TURBO-hybrid_beta5_int8.safetensors", "diffusion_models/10Eros_Max_h3_TURBO-hybrid_beta5_int8.safetensors"),
              ("TenStrip/10Eros-Max", "10Eros_Max_h3_8stepTURBO_beta6_int8.safetensors", "diffusion_models/10Eros_Max_h3_8stepTURBO_beta6_int8.safetensors"),
          ]
          api = HfApi()
          target = os.environ["TARGET"]
          api.create_repo(target, repo_type="model", private=False, exist_ok=True)
          present = {f.path: f.size for f in api.list_repo_tree(target, recursive=True) if getattr(f, "size", None)}
          for repo, src, dest in FILES:
              if dest in present:
                  print(f"already present: {dest}", flush=True); continue
              t = time.time()
              path = hf_hub_download(repo, src, local_dir="/mnt/models")
              size = os.path.getsize(path); t1 = time.time()
              api.upload_file(path_or_fileobj=path, path_in_repo=dest, repo_id=target,
                              commit_message=f"Add {dest.split('/')[-1]} from {repo}")
              t2 = time.time()
              print(f"{dest}: {size/1e9:.2f} GB  download {t1-t:.0f}s ({size/1e6/max(t1-t,1):.0f} MB/s)  upload {t2-t1:.0f}s", flush=True)
              shutil.rmtree("/mnt/models", ignore_errors=True); os.makedirs("/mnt/models", exist_ok=True)
          keep = {dest for _, _, dest in FILES}
          stale = [p for p in present if p not in keep and p.endswith(".safetensors")]
          if stale:
              from huggingface_hub import CommitOperationDelete
              api.create_commit(target, operations=[CommitOperationDelete(path_in_repo=p) for p in stale],
                                commit_message="Remove files no longer used by the livestream: " + ", ".join(p.split("/")[-1] for p in stale))
              print("removed:", *stale, sep="\n  ", flush=True)
          info = api.repo_info(target)
          total = sum(f.size for f in api.list_repo_tree(target, recursive=True) if getattr(f, "size", None))
          print(f"COMMIT {info.sha}  total {total/1e9:.1f} GB")
