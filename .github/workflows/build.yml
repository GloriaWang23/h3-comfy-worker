name: build image

# Builds the worker image and pushes it to ghcr.io/<owner>/h3-comfy-worker.
#   - every push to main: tags :main and :sha-<short>
#   - a tag v*: also tags :<tag> (pin endpoints to these)
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Changes that do not affect the image.
    paths-ignore: [".github/workflows/sync-models.yml", "tests/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The base image is ~15 GB compressed; the stock runner keeps only ~20 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/microsoft /opt/google /usr/local/julia*
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gloriawang23/h3-comfy-worker
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Disk after build
        if: always()
        run: df -h /
